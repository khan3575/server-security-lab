# Lab SSH hardening
# Location on the server: /etc/ssh/sshd_config.d/00-hardening.conf
# Named 00- so it loads first: in sshd the first value set wins.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers sakib
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
